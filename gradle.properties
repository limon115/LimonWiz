# Project-wide Gradle settings
# Author: Khalid Hasan Limon

# Enable AndroidX architecture mapping globally
android.useAndroidX=true

# Enable Jetifier to automatically rewrite legacy third-party binary libraries
android.enableJetifier=true

# Maximize background compiler daemon performance parameters for fast cloud execution
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable parallel task execution for faster build steps
org.gradle.parallel=true
