name: Android Cloud Build
# Author: Khalid Hasan Limon
# Prevents local building on phone to protect thermals and battery

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Gradle Wrapper via Dummy Root Project
      run: |
        mkdir -p /tmp/isolated-wrapper
        cd /tmp/isolated-wrapper
        touch settings.gradle.kts
        gradle wrapper --gradle-version 8.2 --distribution-type bin
        cd $GITHUB_WORKSPACE
        cp /tmp/isolated-wrapper/gradlew .
        cp -r /tmp/isolated-wrapper/gradle .

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
